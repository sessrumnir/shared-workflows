---
# Until actionlint knows the $/ self-repository syntax: https://github.com/rhysd/actionlint/issues/711
paths:
  .github/workflows/lint.yml:
    ignore:
      - 'specifying action "\$/\.github/actions/[a-z-]+" in invalid format because ref is missing'
  .github/workflows/ci.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/lint\.yml" at "uses" is not following the format'
  .github/workflows/collection-ci.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/lint\.yml" at "uses" is not following the format'
      - 'specifying action "\$/\.github/actions/[a-z-]+" in invalid format because ref is missing'
  .github/workflows/collection-train.yml:
    ignore:
      - 'specifying action "\$/\.github/actions/[a-z-]+" in invalid format because ref is missing'
  .github/workflows/image-build.yml:
    ignore:
      - 'specifying action "\$/\.github/actions/[a-z-]+" in invalid format because ref is missing'
  .github/workflows/image-scan.yml:
    ignore:
      - 'specifying action "\$/\.github/actions/[a-z-]+" in invalid format because ref is missing'
