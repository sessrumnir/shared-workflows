---
name: ci-registry
description: Adds the runner's CI registry robot to a Docker config and names the run's CI image
inputs:
  image:
    description: The image's directory name
    required: true
  config:
    description: Directory of the Docker config to add the login to
    required: true
  required:
    description: "true: fail without a robot on the runner; false: report ready=false"
    required: false
    default: "true"
outputs:
  ready:
    description: true when the login was added
    value: ${{ steps.login.outputs.ready }}
  image:
    description: The image's repository in the robot's registry, <registry>/<owner>-ci/<repository>/<image>
    value: ${{ steps.login.outputs.image }}
runs:
  using: composite
  steps:
    - id: login
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        CONFIG: ${{ inputs.config }}
        REQUIRED: ${{ inputs.required }}
      run: bash "${GITHUB_ACTION_PATH}/ci-registry.sh"
