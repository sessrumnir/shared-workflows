---
name: lychee
description: lychee's link check over the checkout, as its config file says
inputs:
  config:
    description: The lychee config file; offline = true there keeps the check off the network
    required: false
    default: .lychee.toml
  files:
    description: The files to check, as a glob lychee expands itself
    required: false
    default: "**/*.md"
runs:
  using: docker
  image: docker://ghcr.io/sessrumnir/lychee:0.24.2@sha256:42e94541cadc1b3094fcf8b3f9992ad976804b6e0bdcae73dd370cd8263b0cc7
  args:
    - "--no-progress"
    - "--config"
    - ${{ inputs.config }}
    - ${{ inputs.files }}
