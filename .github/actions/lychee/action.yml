---
name: lychee
description: lychee's link check over the checkout, as its config file says
inputs:
  config:
    description: The lychee config file; offline = true there keeps the check off the network
    required: false
    default: .lychee.toml
  files:
    description: The files to check, as a glob lychee expands itself
    required: false
    default: "**/*.md"
runs:
  using: docker
  image: docker://ghcr.io/sessrumnir/lychee:0.24.2@sha256:72ba1b40191eb29510a6148f3f26334d24a11542a81753886d784c758b68009e
  entrypoint: /usr/local/bin/lychee
  args:
    - "--no-progress"
    - "--config"
    - ${{ inputs.config }}
    - ${{ inputs.files }}
