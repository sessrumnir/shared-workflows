---
name: lychee
description: lychee's link check over the checkout, as its config file says
inputs:
  config:
    description: The lychee config file; offline = true there keeps the check off the network
    required: false
    default: .lychee.toml
  files:
    description: The files to check, as a glob lychee expands itself
    required: false
    default: "**/*.md"
runs:
  using: docker
  image: docker://ghcr.io/sessrumnir/lychee:0.24.2@sha256:0dfd7f8c8340c910612e073c27084947ecd18ffa968372fe283a93fcec07e7bc
  entrypoint: /usr/local/bin/lychee
  args:
    - "--no-progress"
    - "--config"
    - ${{ inputs.config }}
    - ${{ inputs.files }}
