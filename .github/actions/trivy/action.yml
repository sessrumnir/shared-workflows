---
name: trivy
description: trivy's secret and misconfiguration scan, offline
runs:
  using: docker
  image: docker://ghcr.io/sessrumnir/trivy:0.76.2@sha256:6abbba2aa60a9b7176927b3c6654bca5c59a2d2983c5797e80ca7257b8cd2db8
  args:
    - "filesystem"
    - "--scanners"
    - "secret,misconfig"
    - "--severity"
    - "HIGH,CRITICAL"
    - "--exit-code"
    - "1"
    - "--skip-db-update"
    - "--skip-check-update"
    - "--offline-scan"
    - "--quiet"
    - "."
