---
name: trivy
description: trivy's secret and misconfiguration scan, offline
runs:
  using: docker
  image: docker://ghcr.io/sessrumnir/trivy:0.76.2@sha256:93718fadd8cd9ec0990b0e15967558219fbc10ced6ba05d6b04b9b727d306b0a
  args:
    - "filesystem"
    - "--scanners"
    - "secret,misconfig"
    - "--severity"
    - "HIGH,CRITICAL"
    - "--exit-code"
    - "1"
    - "--skip-db-update"
    - "--skip-check-update"
    - "--offline-scan"
    - "--quiet"
    - "."
