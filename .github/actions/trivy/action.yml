---
name: trivy
description: trivy's secret and misconfiguration scan, offline
runs:
  using: docker
  image: docker://ghcr.io/sessrumnir/trivy:0.76.1@sha256:7159a59fb1f3fcb613d552559372525d7ce93786761af111b468512925bc144e
  args:
    - "filesystem"
    - "--scanners"
    - "secret,misconfig"
    - "--severity"
    - "HIGH,CRITICAL"
    - "--exit-code"
    - "1"
    - "--skip-db-update"
    - "--skip-check-update"
    - "--offline-scan"
    - "--quiet"
    - "."
