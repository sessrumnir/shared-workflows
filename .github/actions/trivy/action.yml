---
name: trivy
description: trivy's secret and misconfiguration scan, offline
runs:
  using: docker
  image: docker://ghcr.io/sessrumnir/trivy:0.76.1@sha256:3d8c7ed14d86cc871ab557da6a97f8f146eeaf92008ab5effbc3b79fb2989c30
  args:
    - "filesystem"
    - "--scanners"
    - "secret,misconfig"
    - "--severity"
    - "HIGH,CRITICAL"
    - "--exit-code"
    - "1"
    - "--skip-db-update"
    - "--skip-check-update"
    - "--offline-scan"
    - "--quiet"
    - "."
