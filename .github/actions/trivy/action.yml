---
name: trivy
description: trivy's secret and misconfiguration scan, offline
runs:
  using: docker
  image: docker://ghcr.io/sessrumnir/trivy:0.76.2@sha256:9173b95c8793a901ec13140ed771943cfff02e478582bd4ca2d9de099b4301d0
  args:
    - "filesystem"
    - "--scanners"
    - "secret,misconfig"
    - "--severity"
    - "HIGH,CRITICAL"
    - "--exit-code"
    - "1"
    - "--skip-db-update"
    - "--skip-check-update"
    - "--offline-scan"
    - "--quiet"
    - "."
