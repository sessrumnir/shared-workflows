---
name: markdownlint
description: markdownlint over every Markdown file but the changelog
runs:
  using: docker
  image: docker://ghcr.io/sessrumnir/markdownlint:0.49.1@sha256:78d7791994495c9cc852ea26dee82ab6af7da09750a9cef4951314eca3ddd11d
  args:
    - "--dot"
    - "--ignore"
    - ".git"
    - "--ignore"
    - "CHANGELOG.md"
    - "."
