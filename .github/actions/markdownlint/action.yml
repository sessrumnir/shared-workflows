---
name: markdownlint
description: markdownlint over every Markdown file but the changelog
runs:
  using: docker
  image: docker://ghcr.io/sessrumnir/markdownlint:0.50.0@sha256:1f0ff34843ef2d2c179a501306e8b31067eecc1755bdb2d7dcae66374aca83e7
  entrypoint: /nodejs/bin/node
  args:
    - "/opt/markdownlint/node_modules/markdownlint-cli/markdownlint.js"
    - "--dot"
    - "--ignore"
    - ".git"
    - "--ignore"
    - "CHANGELOG.md"
    - "."
