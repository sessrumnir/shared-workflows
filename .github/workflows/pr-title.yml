---
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:
  workflow_call:

permissions: {}

jobs:
  conventional:
    if: github.event_name != 'merge_group'
    timeout-minutes: 5
    runs-on: ${{ github.event.repository.private && (vars.JOBS_RUNNER || vars.PRIVATE_RUNNER) || 'ubuntu-latest' }}
    container:
      image: ghcr.io/sessrumnir/python-uv:3.14.10@sha256:f4c0fdab97757d92f60d34a697a572c17689355d4c4ed0e9299134b8cc0bd83e
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9_./-]+\))?!?: [^ ].*$'
          if [[ ! "${TITLE}" =~ ${pattern} ]]; then
            echo "::error::PR title must be a conventional commit, e.g. 'fix(users): unlock re-added users'. Got: ${TITLE}"
            exit 1
          fi
