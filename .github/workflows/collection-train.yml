---
name: collection-train

on:
  workflow_call:
    inputs:
      app-client-id:
        type: string
        required: true
      tested-sha:
        type: string
        required: true
    secrets:
      app-private-key:
        required: true

permissions:
  contents: read

jobs:
  # Merges the open Release Please pull request when the full suite just passed on the current main
  # and the pull request changes nothing but release metadata: the squash merge then releases
  # exactly the tested tree plus the new version. Major releases and breaking changes stay manual:
  # with bump-minor-pre-major a breaking change before 1.0 is only a minor bump. The App token
  # merges, so the push to main starts the release workflow.
  release:
    if: >-
      github.ref == 'refs/heads/main'
      && contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)
    timeout-minutes: 10
    runs-on: ${{ (github.event.repository.private || github.event_name == 'schedule') && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Create a GitHub App token to merge the release
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Merge the release the suite tested
        uses: $/.github/actions/merge-release
        with:
          token: ${{ steps.app.outputs.token }}
          tested-sha: ${{ inputs.tested-sha }}
