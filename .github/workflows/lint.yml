---
name: lint

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: Minutes before each lint job is cancelled
        type: number
        default: 20
      hadolint:
        description: Lint the Containerfile at the repository root
        type: boolean
        default: false
      checkov:
        description: Scan with checkov
        type: boolean
        default: true
      trivy:
        description: Scan for secrets and misconfigurations with trivy
        type: boolean
        default: true
      make-targets:
        description: Repository-specific make targets that need Docker, such as a Go or Ansible linter
        type: string
        default: ""

permissions:
  contents: read

jobs:
  checks:
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ${{ github.event.repository.private && (vars.JOBS_RUNNER || vars.PRIVATE_RUNNER) || 'ubuntu-latest' }}
    container:
      image: ghcr.io/sessrumnir/python-uv:3.14.10@sha256:f4c0fdab97757d92f60d34a697a572c17689355d4c4ed0e9299134b8cc0bd83e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/files
      - uses: $/.github/actions/actionlint
      - uses: $/.github/actions/gitleaks
      - uses: $/.github/actions/renovate-config-validator
      - uses: $/.github/actions/markdownlint
      - if: inputs.hadolint
        uses: $/.github/actions/hadolint
      - if: inputs.checkov
        uses: $/.github/actions/checkov
      - if: inputs.trivy
        uses: $/.github/actions/trivy

  zizmor:
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ${{ github.event.repository.private && (vars.JOBS_RUNNER || vars.PRIVATE_RUNNER) || 'ubuntu-latest' }}
    container:
      image: ghcr.io/sessrumnir/zizmor:1.31.1@sha256:b1c7c9c185f50e2034d611c72ef5a8aaf8f87b51b0e7cd0c5f93eaa72c60aa8c
    defaults:
      run:
        shell: sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .

  make:
    if: inputs.make-targets != ''
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ${{ github.event.repository.private && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        env:
          TARGETS: ${{ inputs.make-targets }}
        run: |
          read -ra targets <<< "${TARGETS}"
          make -- "${targets[@]}"
