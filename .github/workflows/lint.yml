---
name: lint

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: Minutes before each lint job is cancelled
        type: number
        default: 20
      hadolint:
        description: Lint the Containerfile at the repository root
        type: boolean
        default: false
      checkov:
        description: Scan with checkov
        type: boolean
        default: true
      trivy:
        description: Scan for secrets and misconfigurations with trivy
        type: boolean
        default: true
      trivy-lockfiles:
        description: Scan the lockfiles for vulnerabilities with trivy, which downloads its DB
        type: boolean
        default: true
      lychee:
        description: Check links with lychee as .lychee.toml says; offline = true there keeps it off the network
        type: boolean
        default: false
      lychee-online-config:
        description: A lychee config with offline = false; when set, a job with network checks the external links too
        type: string
        default: ""
      make-targets:
        description: Repository-specific make targets that need Docker, such as a Go or Ansible linter
        type: string
        default: ""

permissions:
  contents: read

jobs:
  checks:
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ${{ github.event.repository.private && (vars.JOBS_RUNNER || vars.PRIVATE_RUNNER) || 'ubuntu-latest' }}
    container:
      image: ghcr.io/sessrumnir/python-uv:3.14.10@sha256:8123303ccc1ffca8b351e175b85c6ba5ad2742512053cf3b977ee7054f623316
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/files
      - uses: $/.github/actions/actionlint
      - uses: $/.github/actions/gitleaks
      - uses: $/.github/actions/renovate-config-validator
      - uses: $/.github/actions/markdownlint
      - if: inputs.hadolint
        uses: $/.github/actions/hadolint
      - if: inputs.checkov
        uses: $/.github/actions/checkov
      - if: inputs.trivy
        uses: $/.github/actions/trivy
      - if: inputs.lychee
        uses: $/.github/actions/lychee

  zizmor:
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ${{ github.event.repository.private && (vars.JOBS_RUNNER || vars.PRIVATE_RUNNER) || 'ubuntu-latest' }}
    container:
      image: ghcr.io/sessrumnir/zizmor:1.31.1@sha256:701fd52770c901d77abff41f2a2e599972a24cd8792722535d888698f884fdaf
    defaults:
      run:
        shell: sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .

  lockfiles:
    if: inputs.trivy-lockfiles
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ${{ github.event.repository.private && (vars.JOBS_RUNNER || vars.PRIVATE_RUNNER) || 'ubuntu-latest' }}
    container:
      image: ghcr.io/sessrumnir/trivy:0.76.2@sha256:453ada62e59aaec9e3952563f03d1c868242c83a794bafb0989c8dc8f1e5bd03
    defaults:
      run:
        shell: sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: day
        run: echo "day=$(date -u +%F)" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - name: trivy
        env:
          TRIVY_DB_REPOSITORY: ${{ github.event.repository.private && vars.TRIVY_DB_REPOSITORY || '' }}
        run: >-
          trivy filesystem --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 --skip-java-db-update --no-progress .

  links:
    if: inputs.lychee-online-config != ''
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ${{ github.event.repository.private && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The run's own read-only token, against GitHub's rate limits.
      - uses: $/.github/actions/lychee
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          config: ${{ inputs.lychee-online-config }}

  make:
    if: inputs.make-targets != ''
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ${{ github.event.repository.private && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        env:
          TARGETS: ${{ inputs.make-targets }}
        run: |
          read -ra targets <<< "${TARGETS}"
          make -- "${targets[@]}"
