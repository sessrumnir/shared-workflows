---
name: image-build

on:
  workflow_call:
    inputs:
      # Push ghcr.io/<owner>/<image> with its tags and prune old versions.
      push:
        type: boolean
        default: false
      # auto: the images the pull request or push changed. all: every image.
      mode:
        type: string
        default: auto
      # Directory holding one subdirectory per image; "." for the top level.
      directory:
        type: string
        default: images

permissions:
  contents: read

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ${{ vars.PRIVATE_RUNNER }}
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the images this run builds
        id: select
        env:
          MODE: ${{ inputs.mode }}
          DIRECTORY: ${{ inputs.directory }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          case "${MODE}" in
            auto | all) ;;
            *) echo "::error::mode must be auto or all, not ${MODE}"; exit 1 ;;
          esac
          if ! [[ ${DIRECTORY} =~ ^(\.|[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*)/?$ ]]; then
            echo "::error::directory must be . or a relative path without dots, not ${DIRECTORY}"
            exit 1
          fi
          prefix="${DIRECTORY%/}/"
          if [ "${prefix}" = ./ ]; then prefix=""; fi
          all=$(for file in "${prefix}"*/Containerfile; do
                  if [ -f "${file}" ]; then basename "$(dirname "${file}")"; fi
                done | jq -Rcs 'split("\n") | map(select(length > 0))')
          if [ "${MODE}" = all ] || [ -z "${BASE}" ] || [ "${BASE}" = 0000000000000000000000000000000000000000 ]; then
            images=${all}
          else
            images='[]'
            while IFS= read -r file; do
              if [[ ${file} == "${prefix}"* ]] && [[ ${file#"${prefix}"} =~ ^([^/]+)/ ]]; then
                images=$(jq -c --arg image "${BASH_REMATCH[1]}" '. + [$image] | unique' <<< "${images}")
              elif [ "${file}" = .hadolint.yaml ]; then
                images=${all}
                break
              fi
            done < <(git diff --name-only "${BASE}...${HEAD}")
            images=$(jq -c --argjson all "${all}" '[.[] | select(. as $image | $all | index($image))]' <<< "${images}")
          fi
          echo "images=${images}" >> "${GITHUB_OUTPUT}"
          echo "images: ${images}"

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    timeout-minutes: 60
    runs-on: ${{ vars.PRIVATE_RUNNER }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      DIR: ${{ inputs.directory == '.' && matrix.image || format('{0}/{1}', inputs.directory, matrix.image) }}
      REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry login lives in a throwaway Docker config that is gone before any repository
      # code runs.
      - name: Lint the Containerfile
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          HADOLINT: ghcr.io/${{ github.repository_owner }}/hadolint@sha256:3695882bc1e6e5bd6bb40d11a771936bb5873286e5ee4b5a1874e61acf4139ec # stable
        run: |
          set -euo pipefail
          login=$(mktemp -d)
          trap 'rm -rf "${login}"' EXIT
          printf '%s' "${TOKEN}" | docker --config "${login}" login ghcr.io --username "${ACTOR}" --password-stdin
          docker --config "${login}" pull --quiet "${HADOLINT}"
          rm -rf "${login}"
          docker run --rm --interactive --volume "${PWD}/.hadolint.yaml:/hadolint.yaml:ro" \
            "${HADOLINT}" --config /hadolint.yaml - < "${DIR}/Containerfile"
      - name: Connect to the cluster's rootless BuildKit
        run: >-
          docker buildx create --name ci --use --driver remote
          --driver-opt "cacert=${HOME}/.buildkit/ca.crt,cert=${HOME}/.buildkit/tls.crt,key=${HOME}/.buildkit/tls.key,servername=buildkitd.buildkit.svc"
          "${BUILDKIT_HOST}"
      # An image that will be pushed is built without the shared BuildKit cache and with fresh base
      # images, so nothing a pull request build left in the cache can reach it.
      - name: Build
        env:
          FRESH: >-
            ${{ inputs.push && github.ref == 'refs/heads/main'
            && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) }}
        run: |
          set -euo pipefail
          fresh=()
          if [ "${FRESH}" = true ]; then
            fresh=(--no-cache --pull)
          fi
          docker buildx build "${fresh[@]}" --file "${DIR}/Containerfile" \
            --output "type=docker,dest=${RUNNER_TEMP}/image.tar" --tag "${REF}:stable" "${DIR}"
      - name: Load and test
        run: |
          set -euo pipefail
          docker load --input "${RUNNER_TEMP}/image.tar"
          "${DIR}/test.sh" "${REF}:stable" | tee "${RUNNER_TEMP}/test.log"
          version=$(sed -n 's/^version=//p' "${RUNNER_TEMP}/test.log" | tail -n 1)
          if [ -n "${version}" ] && ! [[ ${version} =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::test.sh printed version=${version}, expected digits and dots"
            exit 1
          fi
          printf '%s' "${version}" > "${RUNNER_TEMP}/version"
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          cache-dir: ${{ runner.temp }}/trivy
      - name: SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: spdx-json
          output: ${{ runner.temp }}/sbom.spdx.json
          cache-dir: ${{ runner.temp }}/trivy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ runner.temp }}/sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.push
        with:
          name: image-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/version
          if-no-files-found: error
          retention-days: 1

  # Pushes what build tested, from main only, and never checks out or runs repository code. An image
  # whose build failed has no artifact, so only its own push fails.
  push:
    needs: [changes, build]
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.changes.outputs.images != '[]'
      && inputs.push
      && github.ref == 'refs/heads/main'
      && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    timeout-minutes: 30
    runs-on: ${{ vars.PRIVATE_RUNNER }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}/image
      - name: Push
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ runner.temp }}/image
        run: |
          set -euo pipefail
          version=$(cat "${IMAGE}/version")
          if [ -n "${version}" ] && ! [[ ${version} =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::version ${version}, expected digits and dots"
            exit 1
          fi
          docker load --input "${IMAGE}/image.tar"
          printf '%s' "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          build="${version:+${version}-}$(date -u +%Y%m%d%H%M%S)"
          tags=(stable "${build}")
          if [ -n "${version}" ]; then
            tags+=("${version}")
          fi
          for tag in "${tags[@]}"; do
            docker tag "${REF}:stable" "${REF}:${tag}"
            docker push "${REF}:${tag}"
          done
          echo "::notice::${REF}: ${tags[*]}"
      - name: Keep stable and the two versions before it
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 3
