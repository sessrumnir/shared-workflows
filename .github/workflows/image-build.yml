---
name: image-build

on:
  workflow_call:
    inputs:
      # Push ghcr.io/<owner>/<image> with its tags and prune old versions.
      push:
        type: boolean
        default: false
      # auto: the images the pull request or push changed. all: every image.
      mode:
        type: string
        default: auto
      # Directory holding one subdirectory per image; "." for the top level.
      directory:
        type: string
        default: images

permissions:
  contents: read

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ${{ vars.JOBS_RUNNER || vars.PRIVATE_RUNNER }}
    container:
      image: ghcr.io/sessrumnir/python-uv:3.14.10@sha256:8123303ccc1ffca8b351e175b85c6ba5ad2742512053cf3b977ee7054f623316
    outputs:
      images: ${{ steps.select.outputs.images }}
      # registry: main hands its images to test and push through the CI registry (vars.CI_REGISTRY),
      # cache: through the Actions cache as tarballs.
      handoff: >-
        ${{ vars.CI_REGISTRY != ''
        && github.ref == 'refs/heads/main'
        && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
        && 'registry' || 'cache' }}
      main: >-
        ${{ github.ref == 'refs/heads/main'
        && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the images this run builds
        id: select
        uses: $/.github/actions/select-images
        with:
          mode: ${{ inputs.mode }}
          directory: ${{ inputs.directory }}
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  # Builds each image on a builder runner, which holds a BuildKit client key and runs no repository
  # code: checkout, build, hand-off. Only main's push, schedule and dispatch runs use BUILD_RUNNER;
  # everything else, pull requests included, builds on PR_BUILD_RUNNER with a BuildKit of its own,
  # and fails if that variable is unset.
  #
  # With vars.CI_REGISTRY, main pushes the image to the CI registry as run-<run>-<attempt> and keeps
  # its layer cache there; only main's builder holds a robot that may push, so nothing a pull request
  # builds can reach main's images or cache. Pull requests read that cache and, like every caller
  # without the variable, pass a tarball through the Actions cache, keyed by run and attempt: unlike
  # artifacts, it does not count against the plan's storage.
  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    timeout-minutes: 60
    runs-on: ${{ needs.changes.outputs.main == 'true' && vars.BUILD_RUNNER || vars.PR_BUILD_RUNNER }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      DIR: ${{ inputs.directory == '.' && matrix.image || format('{0}/{1}', inputs.directory, matrix.image) }}
      REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse to build main without the main builder
        if: needs.changes.outputs.main == 'true' && vars.BUILD_RUNNER == ''
        run: |
          echo "::error::Set BUILD_RUNNER: main builds only on the main builder"
          exit 1
      - name: Log in to the CI registry
        id: registry
        if: vars.CI_REGISTRY != ''
        uses: $/.github/actions/ci-registry
        with:
          registry: ${{ vars.CI_REGISTRY }}
          image: ${{ matrix.image }}
          config: ${{ runner.temp }}/docker
          required: ${{ needs.changes.outputs.handoff == 'registry' }}
      - name: Connect to the runner's rootless BuildKit
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker"
          server=${BUILDKIT_HOST#tcp://}
          server=${server%:*}
          docker buildx create --name ci --use --driver remote \
            --driver-opt "cacert=${HOME}/.buildkit/ca.crt,cert=${HOME}/.buildkit/tls.crt,key=${HOME}/.buildkit/tls.key,servername=${server}" \
            "${BUILDKIT_HOST}"
      # An image that will be pushed is built with fresh base images, and without any cache but
      # main's own in the CI registry, so nothing a pull request or an earlier local build left can
      # reach it.
      - name: Build
        env:
          FRESH: ${{ inputs.push && needs.changes.outputs.main == 'true' }}
          HANDOFF: ${{ needs.changes.outputs.handoff }}
          CI_IMAGE: ${{ steps.registry.outputs.image }}
          CACHE: ${{ steps.registry.outputs.ready == 'true' && format('{0}:buildcache', steps.registry.outputs.image) || '' }}
          TAG: run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker"
          trap 'rm -rf "${DOCKER_CONFIG}"' EXIT
          if [ "${HANDOFF}" = registry ]; then
            docker buildx build --pull --file "${DIR}/Containerfile" \
              --cache-from "type=registry,ref=${CACHE}" \
              --cache-to "type=registry,ref=${CACHE},mode=max,image-manifest=true,oci-mediatypes=true" \
              --output "type=image,name=${CI_IMAGE}:${TAG},push=true" "${DIR}"
            exit 0
          fi
          options=()
          if [ "${FRESH}" = true ]; then
            options=(--no-cache --pull)
          elif [ -n "${CACHE}" ]; then
            options=(--cache-from "type=registry,ref=${CACHE}")
          fi
          mkdir -p "${RUNNER_TEMP}/image"
          docker buildx build "${options[@]}" --file "${DIR}/Containerfile" \
            --output "type=docker,dest=${RUNNER_TEMP}/image/image.tar" --tag "${REF}:stable" "${DIR}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.handoff == 'cache'
        with:
          path: ${{ runner.temp }}/image
          key: image-build/${{ github.run_id }}/${{ matrix.image }}/${{ github.run_attempt }}

  # Lints, tests, scans and describes each built image on an ordinary runner, which holds no BuildKit
  # credential and at most a pull-only CI registry robot. An image whose build failed has no tarball
  # or run tag, so only its own test fails.
  test:
    needs: [changes, build]
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.changes.outputs.images != '[]'
    timeout-minutes: 30
    runs-on: ${{ vars.PRIVATE_RUNNER }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      DIR: ${{ inputs.directory == '.' && matrix.image || format('{0}/{1}', inputs.directory, matrix.image) }}
      REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry login lives in a throwaway Docker config that is gone before any repository
      # code runs.
      - name: Lint the Containerfile
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          HADOLINT: ghcr.io/${{ github.repository_owner }}/hadolint:2.15.1@sha256:8fbc8f651255ccd96a77e5bebf72bf5f10091ad96fca0c0ecd5ab0abc00a1661
        run: |
          set -euo pipefail
          login=$(mktemp -d)
          trap 'rm -rf "${login}"' EXIT
          printf '%s' "${TOKEN}" | docker --config "${login}" login ghcr.io --username "${ACTOR}" --password-stdin
          docker --config "${login}" pull --quiet "${HADOLINT}"
          rm -rf "${login}"
          docker run --rm --interactive --volume "${PWD}/.hadolint.yaml:/hadolint.yaml:ro" \
            "${HADOLINT}" --config /hadolint.yaml - < "${DIR}/Containerfile"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.handoff == 'cache'
        with:
          path: ${{ runner.temp }}/image
          key: image-build/${{ github.run_id }}/${{ matrix.image }}/${{ github.run_attempt }}
          restore-keys: image-build/${{ github.run_id }}/${{ matrix.image }}/
          fail-on-cache-miss: true
      - name: Log in to the CI registry
        id: registry
        if: needs.changes.outputs.handoff == 'registry'
        uses: $/.github/actions/ci-registry
        with:
          registry: ${{ vars.CI_REGISTRY }}
          image: ${{ matrix.image }}
          config: ${{ runner.temp }}/ci-registry
      # A rerun of a failed test finds the image under the latest attempt that built it.
      - name: Pull from the CI registry
        if: needs.changes.outputs.handoff == 'registry'
        env:
          CI_IMAGE: ${{ steps.registry.outputs.image }}
        run: |
          set -euo pipefail
          trap 'rm -rf "${RUNNER_TEMP}/ci-registry"' EXIT
          image=''
          for attempt in $(seq "${GITHUB_RUN_ATTEMPT}" -1 1); do
            if docker --config "${RUNNER_TEMP}/ci-registry" pull --quiet "${CI_IMAGE}:run-${GITHUB_RUN_ID}-${attempt}"; then
              image=${CI_IMAGE}:run-${GITHUB_RUN_ID}-${attempt}
              break
            fi
          done
          if [ -z "${image}" ]; then
            echo "::error::no ${CI_IMAGE}:run-${GITHUB_RUN_ID}-<attempt> in the CI registry"
            exit 1
          fi
          digest=$(docker image inspect --format '{{json .RepoDigests}}' "${image}" \
            | jq -r --arg repo "${CI_IMAGE}" '.[] | select(startswith($repo + "@"))')
          if ! [[ ${digest} =~ ^"${CI_IMAGE}"@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected digest reference ${digest}"
            exit 1
          fi
          docker tag "${image}" "${REF}:stable"
          mkdir -p "${RUNNER_TEMP}/image"
          docker save --output "${RUNNER_TEMP}/image/image.tar" "${REF}:stable"
          printf '%s' "${digest}" > "${RUNNER_TEMP}/image/digest"
      - name: Load and test
        env:
          HANDOFF: ${{ needs.changes.outputs.handoff }}
        run: |
          set -euo pipefail
          if [ "${HANDOFF}" = cache ]; then
            docker load --input "${RUNNER_TEMP}/image/image.tar"
          fi
          "${DIR}/test.sh" "${REF}:stable" | tee "${RUNNER_TEMP}/test.log"
          version=$(sed -n 's/^version=//p' "${RUNNER_TEMP}/test.log" | tail -n 1)
          if [ -n "${version}" ] && ! [[ ${version} =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::test.sh printed version=${version}, expected digits and dots"
            exit 1
          fi
          printf '%s' "${version}" > "${RUNNER_TEMP}/image/version"
      - name: Scan and describe
        env:
          TRIVY: ghcr.io/${{ github.repository_owner }}/trivy:0.76.2@sha256:93718fadd8cd9ec0990b0e15967558219fbc10ced6ba05d6b04b9b727d306b0a
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy"
          trivy() {
            docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" --env HOME=/tmp --workdir /src \
              --volume "${PWD}:/src:ro" --volume "${RUNNER_TEMP}/trivy:/cache" \
              --volume "${RUNNER_TEMP}/image/image.tar:/image.tar:ro" \
              "${TRIVY}" image --cache-dir /cache --input /image.tar "$@"
          }
          trivy --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          trivy --format spdx-json --quiet > "${RUNNER_TEMP}/image/sbom.spdx.json"
      # The CI registry keeps the image itself; push copies it from there by digest.
      - name: Drop the tarball the CI registry holds
        if: needs.changes.outputs.handoff == 'registry'
        run: rm "${RUNNER_TEMP}/image/image.tar"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.push && needs.changes.outputs.main == 'true'
        with:
          path: ${{ runner.temp }}/image
          key: image-tested/${{ github.run_id }}/${{ matrix.image }}/${{ github.run_attempt }}

  # Pushes what test passed, from main only, and never checks out or runs repository code. It takes
  # the tarball or CI registry digest, version and SBOM together from the tested cache entry, so it
  # pushes exactly what test passed, and an image whose test failed has none, so only its own push
  # fails. A CI registry digest is copied unchanged, so GHCR serves the very digest test pulled. Each
  # pushed digest is signed keyless with the workflow's GitHub identity, and its SBOM attached as a
  # signed attestation.
  push:
    needs: [changes, test]
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.changes.outputs.images != '[]'
      && inputs.push
      && github.ref == 'refs/heads/main'
      && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    timeout-minutes: 30
    runs-on: ${{ vars.PRIVATE_RUNNER }}
    permissions:
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      COSIGN: ghcr.io/${{ github.repository_owner }}/cosign:3.1.4@sha256:80b19f2ee34c42c3567062b77858c40990212ca53eb38b09512c3bc4a56be5d6
      CRANE: ghcr.io/${{ github.repository_owner }}/crane:0.22.1@sha256:d290b830fb6bf4e671307b8e3c8f4765543b71864d6252447cd4735f3bf38661
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image
          key: image-tested/${{ github.run_id }}/${{ matrix.image }}/${{ github.run_attempt }}
          restore-keys: image-tested/${{ github.run_id }}/${{ matrix.image }}/
          fail-on-cache-miss: true
      - name: Log in to the CI registry
        id: registry
        if: needs.changes.outputs.handoff == 'registry'
        uses: $/.github/actions/ci-registry
        with:
          registry: ${{ vars.CI_REGISTRY }}
          image: ${{ matrix.image }}
          config: ${{ runner.temp }}/docker
      # crane runs on the Docker daemon, which mounts the CI registry's CA at the runner's path.
      - name: Push
        id: push
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ runner.temp }}/image
          HANDOFF: ${{ needs.changes.outputs.handoff }}
          CI_IMAGE: ${{ steps.registry.outputs.image }}
        run: |
          set -euo pipefail
          version=$(cat "${IMAGE}/version")
          if [ -n "${version}" ] && ! [[ ${version} =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::version ${version}, expected digits and dots"
            exit 1
          fi
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker"
          printf '%s' "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          build="${version:+${version}-}$(date -u +%Y%m%d%H%M%S)"
          tags=(stable "${build}")
          if [ -n "${version}" ]; then
            tags+=("${version}")
          fi
          if [ "${HANDOFF}" = registry ]; then
            source=$(cat "${IMAGE}/digest")
            if ! [[ ${source} =~ ^"${CI_IMAGE}"@(sha256:[0-9a-f]{64})$ ]]; then
              echo "::error::unexpected CI registry digest ${source}"
              exit 1
            fi
            sha=${BASH_REMATCH[1]}
            crane=(docker run --rm --read-only --tmpfs /tmp --user "$(id -u):$(id -g)"
              --cap-drop ALL --security-opt no-new-privileges
              --env HOME=/tmp --env DOCKER_CONFIG=/docker --env SSL_CERT_DIR=/etc/ssl/certs:/etc/ci-registry-ca
              --volume "${DOCKER_CONFIG}:/docker:ro" --volume /etc/ci-registry-ca:/etc/ci-registry-ca:ro "${CRANE}")
            "${crane[@]}" copy "${source}" "${REF}:${tags[0]}"
            for tag in "${tags[@]:1}"; do
              "${crane[@]}" tag "${REF}@${sha}" "${tag}"
            done
            echo "::notice::${REF}: ${tags[*]}"
            echo "digest=${REF}@${sha}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          docker load --input "${IMAGE}/image.tar"
          for tag in "${tags[@]}"; do
            docker tag "${REF}:stable" "${REF}:${tag}"
            docker push "${REF}:${tag}"
          done
          echo "::notice::${REF}: ${tags[*]}"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "${REF}:stable")
          if ! [[ ${digest} =~ ^"${REF}"@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected digest reference ${digest}"
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      # cosign runs on the Docker daemon, which sees only the work directory, and as the runner's
      # user so it can read the registry login.
      - name: Sign and attach the SBOM
        env:
          IMAGE: ${{ runner.temp }}/image
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker"
          trap 'rm -rf "${DOCKER_CONFIG}"' EXIT
          cosign=(docker run --rm --read-only --tmpfs /tmp --user "$(id -u):$(id -g)"
            --cap-drop ALL --security-opt no-new-privileges
            --env HOME=/tmp --env DOCKER_CONFIG=/docker
            --env ACTIONS_ID_TOKEN_REQUEST_URL --env ACTIONS_ID_TOKEN_REQUEST_TOKEN
            --volume "${RUNNER_TEMP}/docker:/docker:ro" --volume "${IMAGE}:/image:ro" "${COSIGN}")
          "${cosign[@]}" sign --yes "${DIGEST}"
          "${cosign[@]}" attest --yes --type spdxjson --predicate /image/sbom.spdx.json "${DIGEST}"
          echo "::notice::signed ${DIGEST}"
      # A signed image is five package versions: the image, and a manifest and an index entry each
      # for its signature and its attestation. 150 keeps about 30 images, weeks of nightly rebuilds,
      # so a digest pinned elsewhere outlives the next Renovate run by far.
      - name: Keep the last 30 images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 150
