---
name: image-build

on:
  workflow_call:
    inputs:
      # Push ghcr.io/<owner>/<image> with its tags and prune old versions.
      push:
        type: boolean
        default: false
      # auto: the images the pull request or push changed. all: every image.
      mode:
        type: string
        default: auto
      # Directory holding one subdirectory per image; "." for the top level.
      directory:
        type: string
        default: images

permissions:
  contents: read

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ${{ vars.JOBS_RUNNER || vars.PRIVATE_RUNNER }}
    container:
      image: ghcr.io/sessrumnir/python-uv:3.14.10@sha256:8123303ccc1ffca8b351e175b85c6ba5ad2742512053cf3b977ee7054f623316
    defaults:
      run:
        shell: bash
    outputs:
      images: ${{ steps.select.outputs.images }}
      main: >-
        ${{ github.ref == 'refs/heads/main'
        && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the images this run builds
        id: select
        env:
          MODE: ${{ inputs.mode }}
          DIRECTORY: ${{ inputs.directory }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          case "${MODE}" in
            auto | all) ;;
            *) echo "::error::mode must be auto or all, not ${MODE}"; exit 1 ;;
          esac
          if ! [[ ${DIRECTORY} =~ ^(\.|[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*)/?$ ]]; then
            echo "::error::directory must be . or a relative path without dots, not ${DIRECTORY}"
            exit 1
          fi
          prefix="${DIRECTORY%/}/"
          if [ "${prefix}" = ./ ]; then prefix=""; fi
          all=$(for file in "${prefix}"*/Containerfile; do
                  if [ -f "${file}" ]; then basename "$(dirname "${file}")"; fi
                done | jq -Rcs 'split("\n") | map(select(length > 0))')
          if [ "${MODE}" = all ] || [ -z "${BASE}" ] || [ "${BASE}" = 0000000000000000000000000000000000000000 ]; then
            images=${all}
          else
            images='[]'
            while IFS= read -r file; do
              if [[ ${file} == "${prefix}"* ]] && [[ ${file#"${prefix}"} =~ ^([^/]+)/ ]]; then
                images=$(jq -c --arg image "${BASH_REMATCH[1]}" '. + [$image] | unique' <<< "${images}")
              elif [ "${file}" = .hadolint.yaml ]; then
                images=${all}
                break
              fi
            done < <(git diff --name-only "${BASE}...${HEAD}")
            images=$(jq -c --argjson all "${all}" '[.[] | select(. as $image | $all | index($image))]' <<< "${images}")
          fi
          echo "images=${images}" >> "${GITHUB_OUTPUT}"
          echo "images: ${images}"

  # Builds each image on a builder runner, which holds a BuildKit client key and runs no repository
  # code: checkout, build, upload of the image tarball. Only main's push, schedule and dispatch runs
  # use BUILD_RUNNER; everything else, pull requests included, builds on PR_BUILD_RUNNER with a
  # BuildKit of its own, and fails if that variable is unset.
  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    timeout-minutes: 60
    runs-on: ${{ needs.changes.outputs.main == 'true' && vars.BUILD_RUNNER || vars.PR_BUILD_RUNNER }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      DIR: ${{ inputs.directory == '.' && matrix.image || format('{0}/{1}', inputs.directory, matrix.image) }}
      REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse to build main without the main builder
        if: needs.changes.outputs.main == 'true' && vars.BUILD_RUNNER == ''
        run: |
          echo "::error::Set BUILD_RUNNER: main builds only on the main builder"
          exit 1
      - name: Connect to the runner's rootless BuildKit
        run: |
          set -euo pipefail
          server=${BUILDKIT_HOST#tcp://}
          server=${server%:*}
          docker buildx create --name ci --use --driver remote \
            --driver-opt "cacert=${HOME}/.buildkit/ca.crt,cert=${HOME}/.buildkit/tls.crt,key=${HOME}/.buildkit/tls.key,servername=${server}" \
            "${BUILDKIT_HOST}"
      # An image that will be pushed is built without the BuildKit cache and with fresh base images,
      # so nothing an earlier build left in the cache can reach it.
      - name: Build
        env:
          FRESH: ${{ inputs.push && needs.changes.outputs.main == 'true' }}
        run: |
          set -euo pipefail
          fresh=()
          if [ "${FRESH}" = true ]; then
            fresh=(--no-cache --pull)
          fi
          docker buildx build "${fresh[@]}" --file "${DIR}/Containerfile" \
            --output "type=docker,dest=${RUNNER_TEMP}/image.tar" --tag "${REF}:stable" "${DIR}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.image }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

  # Lints, tests, scans and describes each built image on an ordinary runner, which holds no BuildKit
  # credential. An image whose build failed has no tarball, so only its own test fails.
  test:
    needs: [changes, build]
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.changes.outputs.images != '[]'
    timeout-minutes: 30
    runs-on: ${{ vars.PRIVATE_RUNNER }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      DIR: ${{ inputs.directory == '.' && matrix.image || format('{0}/{1}', inputs.directory, matrix.image) }}
      REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry login lives in a throwaway Docker config that is gone before any repository
      # code runs.
      - name: Lint the Containerfile
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          HADOLINT: ghcr.io/${{ github.repository_owner }}/hadolint:2.15.1@sha256:c8130072cd2f4dd646360b7d55d60d6e0ce3b9c0ac99ea6c4b0dcffe2235162f
        run: |
          set -euo pipefail
          login=$(mktemp -d)
          trap 'rm -rf "${login}"' EXIT
          printf '%s' "${TOKEN}" | docker --config "${login}" login ghcr.io --username "${ACTOR}" --password-stdin
          docker --config "${login}" pull --quiet "${HADOLINT}"
          rm -rf "${login}"
          docker run --rm --interactive --volume "${PWD}/.hadolint.yaml:/hadolint.yaml:ro" \
            "${HADOLINT}" --config /hadolint.yaml - < "${DIR}/Containerfile"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.image }}
          path: ${{ runner.temp }}
      - name: Load and test
        run: |
          set -euo pipefail
          docker load --input "${RUNNER_TEMP}/image.tar"
          "${DIR}/test.sh" "${REF}:stable" | tee "${RUNNER_TEMP}/test.log"
          version=$(sed -n 's/^version=//p' "${RUNNER_TEMP}/test.log" | tail -n 1)
          if [ -n "${version}" ] && ! [[ ${version} =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::test.sh printed version=${version}, expected digits and dots"
            exit 1
          fi
          printf '%s' "${version}" > "${RUNNER_TEMP}/version"
      - name: Scan and describe
        env:
          TRIVY: ghcr.io/${{ github.repository_owner }}/trivy:0.76.2@sha256:6abbba2aa60a9b7176927b3c6654bca5c59a2d2983c5797e80ca7257b8cd2db8
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy"
          trivy() {
            docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" --env HOME=/tmp --workdir /src \
              --volume "${PWD}:/src:ro" --volume "${RUNNER_TEMP}/trivy:/cache" \
              --volume "${RUNNER_TEMP}/image.tar:/image.tar:ro" \
              "${TRIVY}" image --cache-dir /cache --input /image.tar "$@"
          }
          trivy --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          trivy --format spdx-json --quiet > "${RUNNER_TEMP}/sbom.spdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ runner.temp }}/sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.push
        with:
          name: tested-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/version
            ${{ runner.temp }}/sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

  # Pushes what test passed, from main only, and never checks out or runs repository code. An image
  # whose test failed has no tested artifact, so only its own push fails. Each pushed digest is signed
  # keyless with the workflow's GitHub identity, and its SBOM attached as a signed attestation.
  push:
    needs: [changes, test]
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.changes.outputs.images != '[]'
      && inputs.push
      && github.ref == 'refs/heads/main'
      && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    timeout-minutes: 30
    runs-on: ${{ vars.PRIVATE_RUNNER }}
    permissions:
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      COSIGN: ghcr.io/${{ github.repository_owner }}/cosign:3.1.4@sha256:80b19f2ee34c42c3567062b77858c40990212ca53eb38b09512c3bc4a56be5d6
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.image }}
          path: ${{ runner.temp }}/image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-${{ matrix.image }}
          path: ${{ runner.temp }}/image
      - name: Push
        id: push
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ runner.temp }}/image
        run: |
          set -euo pipefail
          version=$(cat "${IMAGE}/version")
          if [ -n "${version}" ] && ! [[ ${version} =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::version ${version}, expected digits and dots"
            exit 1
          fi
          docker load --input "${IMAGE}/image.tar"
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker"
          printf '%s' "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          build="${version:+${version}-}$(date -u +%Y%m%d%H%M%S)"
          tags=(stable "${build}")
          if [ -n "${version}" ]; then
            tags+=("${version}")
          fi
          for tag in "${tags[@]}"; do
            docker tag "${REF}:stable" "${REF}:${tag}"
            docker push "${REF}:${tag}"
          done
          echo "::notice::${REF}: ${tags[*]}"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "${REF}:stable")
          if ! [[ ${digest} =~ ^"${REF}"@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected digest reference ${digest}"
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      # cosign runs on the Docker daemon, which sees only the work directory, and as the runner's
      # user so it can read the registry login.
      - name: Sign and attach the SBOM
        env:
          IMAGE: ${{ runner.temp }}/image
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker"
          trap 'rm -rf "${DOCKER_CONFIG}"' EXIT
          cosign=(docker run --rm --read-only --tmpfs /tmp --user "$(id -u):$(id -g)"
            --cap-drop ALL --security-opt no-new-privileges
            --env HOME=/tmp --env DOCKER_CONFIG=/docker
            --env ACTIONS_ID_TOKEN_REQUEST_URL --env ACTIONS_ID_TOKEN_REQUEST_TOKEN
            --volume "${RUNNER_TEMP}/docker:/docker:ro" --volume "${IMAGE}:/image:ro" "${COSIGN}")
          "${cosign[@]}" sign --yes "${DIGEST}"
          "${cosign[@]}" attest --yes --type spdxjson --predicate /image/sbom.spdx.json "${DIGEST}"
          echo "::notice::signed ${DIGEST}"
      # A signed image is five package versions: the image, and a manifest and an index entry each
      # for its signature and its attestation. 150 keeps about 30 images, weeks of nightly rebuilds,
      # so a digest pinned elsewhere outlives the next Renovate run by far.
      - name: Keep the last 30 images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 150
