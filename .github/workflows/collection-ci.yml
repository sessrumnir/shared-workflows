---
name: collection-ci

on:
  workflow_call:
    inputs:
      app-client-id:
        type: string
        default: ""
      private-collections:
        type: string
        default: ""
      python-version:
        type: string
        default: "3.14"
      # ansible-test needs the ansible_collections layout; false for a repository without it.
      sanity:
        type: boolean
        default: true
      # `make test-python` runs plain pytest tests outside ansible-test.
      python-tests:
        type: boolean
        default: false
      # A JSON list. Each scenario runs as its own job; `molecule` passes when
      # all of them do. Empty: every extensions/molecule/*/molecule.yml that
      # does not bring its own driver (those are the Vagrant VMs).
      molecule-scenarios:
        type: string
        default: ""
      # The collection's own lint make targets, run where the private
      # collections are mirrored; lint.yml runs the common checks.
      make-targets:
        type: string
        default: checkov ansible-lint
      # auto: a pull request, selected from its diff. fast: everything but
      # Molecule. full: everything.
      mode:
        type: string
        default: auto
    secrets:
      app-private-key:
        required: false
    outputs:
      mode:
        value: ${{ jobs.changes.outputs.mode }}

permissions:
  contents: read

env:
  UV_PYTHON: ${{ inputs.python-version }}

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ${{ (github.event.repository.private || github.event_name == 'schedule') && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      scenarios: ${{ steps.select.outputs.scenarios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select what this run needs
        id: select
        uses: $/.github/actions/select-checks
        with:
          mode: ${{ inputs.mode }}
          draft: ${{ github.event.pull_request.draft }}
          head-ref: ${{ github.head_ref }}
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          scenarios: ${{ inputs.molecule-scenarios }}

  # The common checks as container actions, on JOBS_RUNNER where the repository sets it.
  lint:
    needs: changes
    if: needs.changes.outputs.mode != 'skip'
    uses: $/.github/workflows/lint.yml
    with:
      # The collection's checkov needs the ansible framework and skips Molecule: a make target.
      checkov: false

  # The commit stage in one job: Trivy on the clean checkout, then the collection's own lint, the
  # build, the Python tests and ansible-test, each when the mode asks for it.
  checks:
    needs: changes
    if: needs.changes.outputs.mode != 'skip'
    timeout-minutes: 45
    runs-on: ${{ (github.event.repository.private || github.event_name == 'schedule') && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    env:
      MODE: ${{ needs.changes.outputs.mode }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy
        if: contains(fromJSON('["full", "fast"]'), env.MODE)
        env:
          TRIVY: ghcr.io/${{ github.repository_owner }}/trivy:0.76.2@sha256:93718fadd8cd9ec0990b0e15967558219fbc10ced6ba05d6b04b9b727d306b0a
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy"
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --env HOME=/tmp --workdir /src \
            --volume "${PWD}:/src:ro" --volume "${RUNNER_TEMP}/trivy:/cache" \
            "${TRIVY}" filesystem --cache-dir /cache --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress .
      - &app-token
        name: Create a GitHub App token for private sessrumnir collections
        id: app
        if: inputs.private-collections != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          repositories: ${{ inputs.private-collections }}
          permission-contents: read
      # Clones the private collections into local mirrors before any repository code runs and
      # revokes the token on the way out, so make and ansible-galaxy read the mirrors with no
      # credential in reach. The action's own revoke at the end of the job then only warns.
      - &mirror-private-collections
        name: Mirror the private collections, then revoke the token
        if: steps.app.outputs.token != ''
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPOS: ${{ inputs.private-collections }}
          MIRRORS: ${{ runner.temp }}/private-collections
        run: |
          set -euo pipefail -o noglob
          trap 'curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer ${APP_TOKEN}" -H "Accept: application/vnd.github+json" "${GITHUB_API_URL}/installation/token"' EXIT
          mkdir -p "${MIRRORS}"
          auth=$(printf 'x-access-token:%s' "${APP_TOKEN}" | base64 -w 0)
          for repo in ${REPOS//,/ }; do
            if ! [[ ${repo} =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::private-collections holds an invalid repository name: ${repo}"
              exit 1
            fi
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
              git clone --quiet --mirror "https://github.com/${OWNER}/${repo}.git" "${MIRRORS}/${repo}.git"
            ln -s "${repo}.git" "${MIRRORS}/${repo}"
          done
          for repo in ${REPOS//,/ }; do
            git config --global "url.file://${MIRRORS}/${repo}.insteadOf" "https://github.com/${OWNER}/${repo}"
          done
      - name: Lint
        if: inputs.make-targets != ''
        env:
          TARGETS: ${{ inputs.make-targets }}
        run: |
          read -ra targets <<< "${TARGETS}"
          make -- "${targets[@]}"
      - name: Build
        if: contains(fromJSON('["full", "fast"]'), env.MODE)
        run: make build
      - name: Python tests
        if: inputs.python-tests && contains(fromJSON('["full", "fast"]'), env.MODE)
        run: make test-python
      - name: ansible-test
        if: inputs.sanity && contains(fromJSON('["full", "fast"]'), env.MODE)
        run: |
          make test-tree
          export PATH="${PWD}/.venv/bin:${PATH}"
          cd "$(find .ansible/test/ansible_collections -mindepth 2 -maxdepth 2 -type d | head -n 1)"
          ansible-test sanity --docker
          if [ -d tests/unit ]; then ansible-test units --docker; fi
          if [ -d tests/integration ]; then ansible-test integration --docker; fi

  # The acceptance stage: one job per selected scenario.
  molecule-scenario:
    name: molecule (${{ matrix.scenario }})
    needs: [changes, lint, checks]
    if: >-
      needs.changes.result == 'success'
      && needs.lint.result == 'success'
      && needs.checks.result == 'success'
      && needs.changes.outputs.mode == 'full'
      && needs.changes.outputs.scenarios != '[]'
    timeout-minutes: 75
    runs-on: ${{ (github.event.repository.private || github.event_name == 'schedule') && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.changes.outputs.scenarios) }}
    steps:
      - *checkout
      - *app-token
      - *mirror-private-collections
      - run: make test SCENARIO="${SCENARIO}"
        env:
          SCENARIO: ${{ matrix.scenario }}
