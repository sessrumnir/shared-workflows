---
name: collection-release

on:
  workflow_call:
    inputs:
      app-client-id:
        type: string
        required: true
      private-collections:
        type: string
        default: ""
      python-version:
        type: string
        default: "3.14"
    secrets:
      app-private-key:
        required: true

permissions:
  contents: read

env:
  UV_PYTHON: ${{ inputs.python-version }}

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: ${{ (github.event.repository.private || github.event_name == 'schedule') && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}

  # Builds the pushed commit, which Release Please just tagged, without write access; publish never
  # runs repository code.
  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    timeout-minutes: 30
    runs-on: ${{ (github.event.repository.private || github.event_name == 'schedule') && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a GitHub App token for private sessrumnir collections
        id: app
        if: inputs.private-collections != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          repositories: ${{ inputs.private-collections }}
          permission-contents: read
      # Clones the private collections into local mirrors before any repository code runs and
      # revokes the token on the way out, so make and ansible-galaxy read the mirrors with no
      # credential in reach. The action's own revoke at the end of the job then only warns.
      - name: Mirror the private collections, then revoke the token
        if: steps.app.outputs.token != ''
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPOS: ${{ inputs.private-collections }}
          MIRRORS: ${{ runner.temp }}/private-collections
        run: |
          set -euo pipefail -o noglob
          trap 'curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer ${APP_TOKEN}" -H "Accept: application/vnd.github+json" "${GITHUB_API_URL}/installation/token"' EXIT
          mkdir -p "${MIRRORS}"
          auth=$(printf 'x-access-token:%s' "${APP_TOKEN}" | base64 -w 0)
          for repo in ${REPOS//,/ }; do
            if ! [[ ${repo} =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::private-collections holds an invalid repository name: ${repo}"
              exit 1
            fi
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
              git clone --quiet --mirror "https://github.com/${OWNER}/${repo}.git" "${MIRRORS}/${repo}.git"
            ln -s "${repo}.git" "${MIRRORS}/${repo}"
          done
          for repo in ${REPOS//,/ }; do
            git config --global "url.file://${MIRRORS}/${repo}.insteadOf" "https://github.com/${OWNER}/${repo}"
          done
      - run: make build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collection
          path: .ansible/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [release-please, build]
    timeout-minutes: 10
    runs-on: ${{ (github.event.repository.private || github.event_name == 'schedule') && vars.PRIVATE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: collection
          path: dist
      - run: cd dist && sha256sum ./*.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*.tar.gz
      - run: gh release upload "${TAG}" dist/*.tar.gz dist/SHA256SUMS --repo "${REPO}"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
